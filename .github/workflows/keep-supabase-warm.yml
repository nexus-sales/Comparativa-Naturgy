name: Keep Supabase warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        run: |
          curl -sf -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/auth/v1/health"
