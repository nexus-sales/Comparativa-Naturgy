<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparativa Tarifas Naturgy — Canarias</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body { font-size: 14px; font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; background: #edecea; min-height: 100vh; padding: 20px }
        #app { max-width: 1060px; margin: 0 auto; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,.12) }
        .app-header { padding: 0; display: flex; align-items: stretch; background: #002855 }
        .app-header-brand { display: flex; align-items: center; gap: 12px; padding: 14px 24px; flex: 1 }
        .app-header-brand h1 { font-size: 15px; font-weight: 600; color: #fff }
        .app-header-brand .sub { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 1px }
        .app-header-right { display: flex; align-items: center; gap: 8px; padding: 14px 18px }
        .admin-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: rgba(255,255,255,.8); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .2s }
        .admin-btn:hover { border-color: #F5821F; color: #F5821F }
        .admin-btn.on { border-color: #F5821F; background: #F5821F; color: #fff }
        .naturgy-stripe { height: 4px; background: linear-gradient(90deg,#F5821F 0%,#F5821F 30%,#002855 30%) }
        .seg-bar { display: flex; border-bottom: 1px solid #e5e3de; overflow-x: auto; background: #fafaf8 }
        .seg-btn { padding: 12px 20px; border: none; background: transparent; color: #888; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 7px; transition: color .15s }
        .seg-btn .dot { width: 8px; height: 8px; border-radius: 50%; opacity: .4; transition: opacity .15s; flex-shrink: 0 }
        .seg-btn.active .dot { opacity: 1 }
        .seg-btn[data-seg="res"] .dot { background: #185FA5 }
        .seg-btn[data-seg="pyme20"] .dot { background: #0F6E56 }
        .seg-btn[data-seg="pyme20one"] .dot { background: #B45309 }
        .seg-btn[data-seg="pyme361"] .dot { background: #6D28D9 }
        .seg-btn[data-seg="res"].active { color: #185FA5; border-bottom-color: #185FA5 }
        .seg-btn[data-seg="pyme20"].active { color: #0F6E56; border-bottom-color: #0F6E56 }
        .seg-btn[data-seg="pyme20one"].active { color: #B45309; border-bottom-color: #B45309 }
        .seg-btn[data-seg="pyme361"].active { color: #6D28D9; border-bottom-color: #6D28D9 }
        .sub-bar { display: flex; padding: 0 24px; background: #fff; border-bottom: 1px solid #e5e3de }
        .sub-btn { padding: 10px 16px; border: none; background: transparent; color: #999; font-size: 12px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s }
        .sub-btn.active { font-weight: 600 }
        .pane { padding: 26px }
        .stitle { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .07em; margin: 22px 0 10px }
        .stitle:first-child { margin-top: 0 }
        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px }
        .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px }
        .g6 { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 12px }
        .fl { display: flex; flex-direction: column; gap: 4px }
        .fl label { font-size: 11px; color: #888; font-weight: 600; letter-spacing: .02em }
        .fl input,.fl select { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #e0ddd8; border-radius: 8px; background: #fff; color: #1a1a1a; outline: none; transition: border-color .15s }
        .fl input:focus,.fl select:focus { border-color: #F5821F; box-shadow: 0 0 0 3px rgba(245,130,31,.08) }
        .hr { height: 1px; background: #f0eeea; margin: 20px 0 }
        .tc { border: 1px solid #e5e3de; border-radius: 12px; margin-bottom: 10px; overflow: hidden }
        .th { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; background: #fafaf8; transition: background .15s }
        .th:hover { background: #f3f2ef }
        .th-accent { width: 3px; height: 28px; border-radius: 2px; background: #F5821F; flex-shrink: 0 }
        .ti { flex: 1; font-size: 13px; font-weight: 600; border: none; background: transparent; color: #1a1a1a; padding: 0; outline: none; min-width: 60px }
        .tbadge { font-size: 10px; padding: 3px 9px; border-radius: 10px; white-space: nowrap; font-weight: 700 }
        .b-blue { background: #dbeafe; color: #1e40af } .b-green { background: #d1fae5; color: #065f46 }
        .b-amber { background: #fef3c7; color: #92400e } .b-purple { background: #ede9fe; color: #5b21b6 }
        .tprev { font-size: 14px; font-weight: 700; white-space: nowrap; color: #002855 }
        .tsav { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600 }
        .spos { background: #d1fae5; color: #065f46 } .sneg { background: #fee2e2; color: #991b1b } .sneu { background: #f3f4f6; color: #6b7280 }
        .chev { font-size: 10px; transition: transform .15s; color: #c0bdb8 }
        .chev.r { transform: rotate(90deg) }
        .tb { padding: 18px 18px; border-top: 1px solid #f0eeea; display: none }
        .tb.on { display: block }
        .price-grid { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px }
        .price-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fafaf8; border-radius: 7px; border: 1px solid #f0eeea }
        .price-row .pr-label { font-size: 12px; color: #666 }
        .price-row .pr-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: #002855 }
        .price-row .pr-unit { font-size: 10px; color: #aaa; margin-left: 3px }
        .lock-bar { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #bbb; padding: 8px 12px; background: #fafaf8; border-radius: 8px; border: 1px solid #f0eeea; margin-bottom: 12px }
        .rsub { margin-top: 16px; padding-top: 16px; border-top: 2px solid #f0eeea }
        .rsub-title { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px }
        .rsub-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; border-radius: 7px; font-size: 13px }
        .rsub-row:nth-child(even) { background: #fafaf8 }
        .rsub-row .rr-label { color: #555; font-weight: 500 }
        .rsub-row .rr-val { font-weight: 700; color: #1a1a1a; font-variant-numeric: tabular-nums }
        .rsub-sep { height: 1px; background: #e5e3de; margin: 6px 0 }
        .rsub-total { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #002855; border-radius: 9px; margin-top: 8px }
        .rsub-total .rt-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .05em }
        .rsub-total .rt-val { font-size: 18px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums }
        .btn { padding: 7px 15px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s }
        .btn:hover { background: #f5f4f0 }
        .btn-d { color: #dc2626; border-color: #fca5a5 } .btn-d:hover { background: #fef2f2 }
        .btn-export { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s }
        .btn-pdf { background: #002855; color: #fff } .btn-pdf:hover { background: #003f8a }
        .btn-xls { background: #1a7a3f; color: #fff } .btn-xls:hover { background: #14612f }
        .export-bar { display: flex; gap: 8px; margin-bottom: 18px }
        .add-btn { width: 100%; padding: 12px; border: 2px dashed #ddd; border-radius: 12px; background: #fff; color: #aaa; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 6px; transition: all .15s }
        .add-btn:hover { border-color: #F5821F; color: #F5821F; background: #fff8f3 }
        .ra { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px }
        .sc { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin-bottom: 22px }
        .sm { background: #fafaf8; border-radius: 10px; padding: 16px 18px; border: 1px solid #eee }
        .sm.sm-best { border-color: #F5821F; background: #fff8f3 }
        .sm.sm-saving { border-color: #a7f3d0 } .sm.sm-loss { border-color: #fca5a5 }
        .sm .sl { font-size: 11px; color: #aaa; margin-bottom: 5px; font-weight: 500 }
        .sm .sv { font-size: 22px; font-weight: 700; line-height: 1.1 }
        .sm .sn { font-size: 11px; color: #bbb; margin-top: 4px }
        .ct { width: 100%; border-collapse: collapse; font-size: 13px }
        .ct th { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .05em; padding: 9px 12px; text-align: right; background: #002855 }
        .ct th:first-child { text-align: left }
        .ct td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #f0eeea }
        .ct td:first-child { text-align: left; color: #555; font-size: 12px }
        .ct tr:hover td { background: #fafaf8 }
        .ct .tr td { font-weight: 700; background: #FFF4EC; border-top: 2px solid #F5821F }
        .ct .tr td:first-child { color: #002855 }
        .ch-wrap { position: relative; width: 100%; height: 190px; margin-top: 20px }
        .hint { font-size: 11px; color: #bbb; margin-top: 12px; font-style: italic; line-height: 1.7 }
        .btn-clear { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1.5px solid #fca5a5; background: #fff; color: #dc2626; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s }
        .btn-clear:hover { background: #fef2f2 }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: #bbb }
        .empty-state-icon { width: 56px; height: 56px; border-radius: 14px; background: #f5f4f0; display: flex; align-items: center; justify-content: center; margin-bottom: 16px }
        .empty-state h3 { font-size: 15px; font-weight: 600; color: #aaa; margin-bottom: 6px }
        .empty-state p { font-size: 13px; color: #ccc; max-width: 320px; line-height: 1.6 }
        .auth-warning { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #fffbeb; border: 1.5px solid #fbbf24; border-radius: 10px; margin-bottom: 18px }
        .auth-warning-icon { width: 32px; height: 32px; border-radius: 8px; background: #fef3c7; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px }
        .auth-warning-text strong { display: block; font-size: 13px; font-weight: 700; color: #92400e; margin-bottom: 3px }
        .auth-warning-text span { font-size: 12px; color: #b45309; line-height: 1.6 }
        @media(max-width:640px) { .g3 { grid-template-columns: 1fr 1fr } .g6 { grid-template-columns: 1fr 1fr } .pane { padding: 16px } .seg-btn { padding: 10px 14px; font-size: 12px } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px) }
        .modal-overlay.hidden { display: none }
        .modal { background: #fff; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 8px 40px rgba(0,0,0,.2) }
        .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px }
        .modal-icon { width: 40px; height: 40px; border-radius: 10px; background: #002855; display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
        .modal-title { font-size: 15px; font-weight: 700; color: #002855 }
        .modal-sub { font-size: 12px; color: #aaa; margin-top: 2px }
        .modal .fl { margin-bottom: 14px } .modal .fl label { color: #555 }
        .modal .fl input { font-size: 14px; padding: 10px 12px; letter-spacing: .05em }
        .modal-actions { display: flex; gap: 8px; margin-top: 6px }
        .modal-btn { flex: 1; padding: 10px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s }
        .modal-btn-primary { background: #002855; color: #fff } .modal-btn-primary:hover { background: #003f8a }
        .modal-btn-secondary { background: #f3f4f6; color: #555 } .modal-btn-secondary:hover { background: #e5e7eb }
        .modal-error { font-size: 12px; color: #dc2626; margin-top: 8px; display: none }
        .modal-divider { height: 1px; background: #f0eeea; margin: 16px 0 }
        .app-footer { padding: 24px; background: #fafaf8; border-top: 1px solid #e5e3de; text-align: center }
        .footer-content { display: flex; flex-direction: column; align-items: center; gap: 12px }
        .footer-text { font-size: 13px; color: #666; font-weight: 500 }
        .footer-text-small { margin-top: 8px; font-size: 11px; opacity: 0.8 }
        .footer-text strong { color: #002855; font-weight: 700 }
        .footer-links { display: flex; gap: 20px; justify-content: center }
        .footer-link { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; text-decoration: none; transition: all 0.2s; padding: 6px 12px; border-radius: 8px; background: #fff; border: 1px solid #e5e3de }
        .footer-link:hover { color: #F5821F; border-color: #F5821F; background: #fff8f3; transform: translateY(-1px) }
    </style>
</head>

const STORAGE_KEY='naturgy_admin_hash';
const DEFAULT_HASH='220d7e6bc08476d254692e2a664a9c6d49bcd5ce68325359c6007cdff4c633d8';
function getStoredHash(){return localStorage.getItem(STORAGE_KEY)||DEFAULT_HASH;}
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function showModal(t,s,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalSub').textContent=s;document.getElementById('modalBody').innerHTML=b;document.getElementById('modalOverlay').classList.remove('hidden');}
function hideModal(){document.getElementById('modalOverlay').classList.add('hidden');document.getElementById('modalBody').innerHTML='';}
function modalBgClick(e){if(e.target===document.getElementById('modalOverlay'))hideModal();}
function showModalError(msg){const el=document.getElementById('modalErr');if(el){el.textContent=msg;el.style.display='block';}}
function toggleAdmin(){
  if(adminMode){adminMode=false;updateAdminBtn();renderContent();return;}
  showModal('Acceso de administrador','Introduce tu contraseña de admin',`
    <div class="fl"><label>Contraseña</label><input type="password" id="pw1" placeholder="Contraseña" onkeydown="if(event.key==='Enter')confirmLogin()"/></div>
    <div class="modal-error" id="modalErr"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="hideModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmLogin()">Entrar</button>
    </div>`);
  setTimeout(()=>document.getElementById('pw1')?.focus(),50);
}
async function confirmLogin(){
  const p1=document.getElementById('pw1')?.value||'';
  const hash=await sha256(p1);
  if(hash===getStoredHash()){hideModal();adminMode=true;updateAdminBtn();renderContent();}
  else{showModalError('Contraseña incorrecta.');document.getElementById('pw1').value='';document.getElementById('pw1').focus();}
}
function changePassword(){
  showModal('Cambiar contraseña','Introduce la contraseña actual y la nueva',`
    <div class="fl"><label>Contraseña actual</label><input type="password" id="pwOld" placeholder="Contraseña actual" onkeydown="if(event.key==='Enter')confirmChange()"/></div>
    <div class="modal-divider"></div>
    <div class="fl"><label>Nueva contraseña</label><input type="password" id="pw1" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')confirmChange()"/></div>
    <div class="fl"><label>Repite la nueva</label><input type="password" id="pw2" placeholder="Confirma la nueva" onkeydown="if(event.key==='Enter')confirmChange()"/></div>
    <div class="modal-error" id="modalErr"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="hideModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmChange()">Cambiar</button>
    </div>`);
  setTimeout(()=>document.getElementById('pwOld')?.focus(),50);
}
async function confirmChange(){
  const old=document.getElementById('pwOld')?.value||'',p1=document.getElementById('pw1')?.value||'',p2=document.getElementById('pw2')?.value||'';
  const stored=getStoredHash(),hashOld=await sha256(old);
  if(hashOld!==stored){showModalError('La contraseña actual es incorrecta.');return;}
  if(p1.length<6){showModalError('La nueva contraseña debe tener al menos 6 caracteres.');return;}
  if(p1!==p2){showModalError('Las nuevas contraseñas no coinciden.');return;}
  localStorage.setItem(STORAGE_KEY,await sha256(p1));
  hideModal();
  const btn=document.getElementById('adminBtn');
  btn.textContent='✓ Contraseña cambiada';
  setTimeout(()=>{btn.innerHTML='🔓 Admin activo &nbsp;·&nbsp; <span style="font-weight:400;text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();changePassword()">Cambiar contraseña</span>';},2000);
}
function updateAdminBtn(){
  const b=document.getElementById('adminBtn');
  b.className='admin-btn'+(adminMode?' on':'');
  b.innerHTML=adminMode?'🔓 Admin activo &nbsp;·&nbsp; <span style="font-weight:400;text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();changePassword()">Cambiar contraseña</span>':'🔒 Admin';

// ── CALCULATION ───────────────────────────────────────
function calc(seg,t){
  const c=seg.cliente,dias=+c.dias||1,potP=seg.potP||2;
  let costPot=0;
  for(let i=0;i<potP;i++){const r=+(t.rPot[i]||0),kw=+(c.kw[i]||0);if(!r||!kw)continue;costPot+=t.potUnit==='dia'?r*kw*dias:(r/365)*kw*dias;}
  // ── ENERGÍA: tarifa uni usa SUMA de todos los periodos (P1+P2+P3), igual que el Excel
  let costEn=0;const nEn={uni:1,tri:3,hex:6}[t.tipo]||1;
  if(t.tipo==='uni'){costEn=(+(t.rEn[0])||0)*c.en.reduce((a,v)=>a+(+v||0),0);}
  else{for(let i=0;i<nEn;i++)costEn+=(+(t.rEn[i]||0))*(+(c.en[i]||0));}
  const sva=+(t.sva||0),alq=+(c.alquiler||0),subtotal=costPot+costEn+sva+alq;
  const impElec=(subtotal-alq)*(+(c.taxImpElec||0)/100),bono=(+(c.bonoRate||0))*dias;
  if(seg.taxModel==='res'){const igic=alq*(+(c.taxIGIC||0)/100);return{potencia:+costPot.toFixed(4),energia:+costEn.toFixed(4),sva,alquiler:alq,subtotal:+subtotal.toFixed(4),impElec:+impElec.toFixed(4),igic:+igic.toFixed(4),bonoSocial:+bono.toFixed(4),total:+(subtotal+impElec+igic+bono).toFixed(4)};}
  const igicRed=(subtotal+impElec+bono)*(+(c.taxIGICRed||0)/100),igic7=alq*(+(c.taxIGIC7||0)/100);
  return{potencia:+costPot.toFixed(4),energia:+costEn.toFixed(4),sva,alquiler:alq,subtotal:+subtotal.toFixed(4),impElec:+impElec.toFixed(4),igicRed:+igicRed.toFixed(4),igic7:+igic7.toFixed(4),bonoSocial:+bono.toFixed(4),total:+(subtotal+impElec+igicRed+igic7).toFixed(4)};
}

function f(v,d=2){if(v===null||v===undefined||isNaN(+v))return'—';return(+v).toFixed(d).replace('.',',')+'\u202f€';}
function fRaw(v,d=2){if(v===null||v===undefined||isNaN(+v))return'';return(+v).toFixed(d).replace('.',',');}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function buildRsub(r,isPyme){
  const rows=isPyme
    ?[['Coste potencia',r.potencia],['Coste energía',r.energia],r.sva?['SVA',r.sva]:null,['Alquiler contador',r.alquiler],null,['Subtotal',r.subtotal],['Imp. electricidad',r.impElec],['IGIC Reducido 3%',r.igicRed],['IGIC 7% alquiler',r.igic7]]
    :[['Coste potencia',r.potencia],['Coste energía',r.energia],r.sva?['SVA',r.sva]:null,['Alquiler contador',r.alquiler],null,['Subtotal',r.subtotal],['Imp. electricidad',r.impElec],['IGIC alquiler',r.igic||0],['Financiación Bono Social',r.bonoSocial]];
  const html=rows.map(row=>{if(row===null)return'<div class="rsub-sep"></div>';const[label,val]=row;return`<div class="rsub-row"><span class="rr-label">${label}</span><span class="rr-val">${f(val)}</span></div>`;}).join('');
  return`<div class="rsub"><div class="rsub-title">Resumen de costes</div>${html}<div class="rsub-total"><span class="rt-label">Total estimado</span><span class="rt-val">${f(r.total)}</span></div></div>`;
}

// ── TARIFF LIST ───────────────────────────────────────
function renderTar(seg){return`<div class="pane">${authWarningBanner(seg)}${seg.tarifas.map((t,i)=>renderTCard(seg,t,i)).join('')}${adminMode?`<button class="add-btn" onclick="addTariff('${seg.id}')">+ Añadir tarifa</button>`:''}</div>`;}

function renderTCard(seg,t,idx){
  const r=calc(seg,t),ah=+(seg.cliente.factura-r.total).toFixed(2);
  const ac=ah>0.005?'spos':ah<-0.005?'sneg':'sneu';
  const at=ah>0.005?`−${f(ah)}`:ah<-0.005?`+${f(Math.abs(ah))}`:'Igual';
  const tipoBadge={uni:'1 período',tri:'Trihoraria',hex:'6 períodos'}[t.tipo]||t.tipo;
  const tipoBadgeCls={uni:'b-blue',tri:'b-amber',hex:'b-purple'}[t.tipo]||'b-blue';
  const body=t.open?buildTBody(seg,t,idx):'';
  return`<div class="tc"><div class="th" onclick="togT('${seg.id}','${t.id}')"><span class="th-accent" style="${t.selected?'':'background:#ccc'}"></span><input type="checkbox" ${t.selected?'checked':''} onclick="event.stopPropagation();togSelect('${seg.id}','${t.id}')" style="cursor:pointer;width:16px;height:16px"/><span class="chev${t.open?' r':''}">▶</span><input class="ti" value="${t.nombre}" onclick="event.stopPropagation()" oninput="renT('${seg.id}','${t.id}',this.value)"/><span class="tbadge ${tipoBadgeCls}">${tipoBadge}</span><span class="tprev" id="prev_${t.id}">${f(r.total)}</span><span class="tsav ${ac}" id="sav_${t.id}">${at}</span></div><div class="tb${t.open?' on':''}" id="body_${t.id}">${body}</div></div>`;
}

function buildTBody(seg,t,idx){
  const potP=seg.potP||2,lbs=['P1','P2','P3','P4','P5','P6'],isPyme=seg.taxModel!=='res';
  const r=calc(seg,t),nEnShow={uni:1,tri:3,hex:6}[t.tipo]||1,pUL=t.potUnit==='dia'?'€/kW·día':'€/kWaño';
  const types=potP===6?[['uni','1 período'],['hex','6 períodos']]:[['uni','1 período'],['tri','Trihoraria']];
  const tipoBlock=adminMode?`<div style="display:flex;gap:6px;margin-bottom:14px">${types.map(([tp,lb])=>`<button style="padding:5px 14px;border:1.5px solid ${t.tipo===tp?NAT_ORANGE:'#ddd'};border-radius:8px;font-size:11px;font-weight:600;background:${t.tipo===tp?NAT_ORANGE:'#fff'};color:${t.tipo===tp?'#fff':'#777'};cursor:pointer" onclick="chgTipo('${seg.id}','${t.id}','${tp}')">${lb}</button>`).join('')}</div>`:`<div style="margin-bottom:14px"><span class="tbadge ${{uni:'b-blue',tri:'b-amber',hex:'b-purple'}[t.tipo]||'b-blue'}">${{uni:'1 período de energía',tri:'Trihoraria — 3 períodos',hex:'Hexoraria — 6 períodos'}[t.tipo]}</span></div>`;
  const lockBar=!adminMode?`<div class="lock-bar">🔒 Precios oficiales Naturgy — actualizables solo en modo admin</div>`:'';
  let potContent='';
  if(adminMode){const unitSel=`<div class="fl" style="margin-bottom:10px;max-width:220px"><label>Unidad</label><select onchange="upTf('${seg.id}','${t.id}','potUnit',this.value)"><option value="dia"${t.potUnit==='dia'?' selected':''}>€/kW·día</option><option value="anio"${t.potUnit==='anio'?' selected':''}>€/kWaño</option></select></div>`;const grid=`<div class="${potP===6?'g6':'g2'}">${lbs.slice(0,potP).map((lb,i)=>`<div class="fl"><label>${lb} (${pUL})</label><input type="number" step="0.000001" value="${t.rPot[i]||0}" oninput="upTarr('${seg.id}','${t.id}','rPot',${i},this.value)"/></div>`).join('')}</div>`;potContent=unitSel+grid;}
  else{potContent=`<div class="price-grid">${lbs.slice(0,potP).filter((_,i)=>t.rPot[i]).map((lb,i)=>`<div class="price-row"><span class="pr-label">Potencia ${lb}</span><span><span class="pr-val">${(+t.rPot[i]).toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}</span><span class="pr-unit">${pUL}</span></span></div>`).join('')}</div>`;}
  let enContent='';
  if(adminMode){enContent=`<div class="${nEnShow===6?'g6':nEnShow===3?'g3':'g2'}">${lbs.slice(0,nEnShow).map((lb,i)=>`<div class="fl"><label>${t.tipo==='uni'&&i===0?'Energía — todos los períodos':`Energía ${lb}`} (€/kWh)</label><input type="number" step="0.000001" value="${t.rEn[i]||0}" oninput="upTarr('${seg.id}','${t.id}','rEn',${i},this.value)"/></div>`).join('')}</div>`;}
  else{enContent=`<div class="price-grid">${lbs.slice(0,nEnShow).map((lb,i)=>`<div class="price-row"><span class="pr-label">${t.tipo==='uni'&&i===0?'Energía (todos los períodos)':`Energía ${lb}`}</span><span><span class="pr-val">${(+t.rEn[i]).toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}</span><span class="pr-unit">€/kWh</span></span></div>`).join('')}</div>`;}
  return`<div>${tipoBlock}${lockBar}
    <div style="margin-bottom:16px"><div class="stitle" style="margin-top:0">Término de potencia</div>${potContent}</div>
    <div style="margin-bottom:16px"><div class="stitle" style="margin-top:0">Término de energía</div>${enContent}</div>
    ${adminMode?`<div class="fl" style="margin-bottom:6px;max-width:220px"><label>SVA (€)</label><input type="number" step="0.01" value="${t.sva||0}" oninput="upTf('${seg.id}','${t.id}','sva',this.value)"/></div>`:(t.sva?`<div class="price-row" style="max-width:220px;margin-bottom:6px"><span class="pr-label">SVA</span><span><span class="pr-val">${(+(t.sva)).toFixed(2).replace('.',',')}</span><span class="pr-unit">€</span></span></div>`:'')}
    <div id="rsub_${t.id}">${buildRsub(r,isPyme)}</div>
    <div class="ra">${adminMode?`<button class="btn btn-d" onclick="delT('${seg.id}','${t.id}')">Eliminar tarifa</button>`:''}</div>
  </div>`;
}

// ── COMPARATIVA ───────────────────────────────────────
function clienteVacio(seg){const c=seg.cliente;return !+c.factura&&c.en.every(v=>!+v)&&c.kw.every(v=>!+v);}

function renderComp(seg){
  if(clienteVacio(seg)){return`<div class="pane">${authWarningBanner(seg)}<div class="empty-state"><div class="empty-state-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><h3>Sin datos de cliente</h3><p>Introduce los datos del cliente en la pestaña <strong>Datos cliente</strong> para ver la comparativa de tarifas.</p></div></div>`;}
  const c=seg.cliente,results=seg.tarifas.filter(t=>t.selected).map((t,i)=>({t,r:calc(seg,t),color:COLS[i%COLS.length]}));
  if(results.length===0){return`<div class="pane"><div class="empty-state"><div class="empty-state-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div><h3>No hay tarifas seleccionadas</h3><p>Ve a la pestaña <strong>Tarifas</strong> y selecciona al menos una para comparar.</p></div></div>`;}
  const best=results.reduce((a,b)=>b.r.total<a.r.total?b:a,results[0]);
  const bestAh=best?+(c.factura-best.r.total).toFixed(2):0;
  const isPyme=seg.taxModel!=='res';
  const sc=`<div class="sc"><div class="sm"><div class="sl">Factura actual</div><div class="sv">${f(c.factura)}</div><div class="sn">${esc(c.nombre)||'Cliente'}</div></div>${best?`<div class="sm sm-best"><div class="sl">Mejor opción</div><div class="sv" style="color:${NAT_ORANGE}">${f(best.r.total)}</div><div class="sn">${esc(best.t.nombre)}</div></div>`:''} ${best?`<div class="sm ${bestAh>=0?'sm-saving':'sm-loss'}"><div class="sl">Ahorro máximo</div><div class="sv" style="color:${bestAh>=0?'#065f46':'#dc2626'}">${bestAh>=0?'−':'+'}${f(Math.abs(bestAh))}</div><div class="sn">vs factura actual</div></div>`:''}<div class="sm"><div class="sl">Tarifas comparadas</div><div class="sv">${results.length}</div></div></div>`;
  const rowDefs=isPyme?[['Coste potencia','potencia'],['Coste energía','energia'],['SVA','sva'],['Alquiler','alquiler'],['Subtotal','subtotal'],['Imp. electricidad','impElec'],['IGIC Red. 3%','igicRed'],['IGIC 7% alquiler','igic7'],['Bono Social *','bonoSocial']]:[['Coste potencia','potencia'],['Coste energía','energia'],['SVA','sva'],['Alquiler','alquiler'],['Subtotal','subtotal'],['Imp. electricidad','impElec'],['IGIC alquiler','igic'],['Bono Social','bonoSocial']];
  const ths=['Componente','Factura actual',...results.map(x=>`<span style="font-weight:700">${esc(x.t.nombre)}</span>`)].join('</th><th>');
  const trs=rowDefs.map(([lbl,key])=>{const isBono=key==='bonoSocial'&&isPyme;const base=key==='alquiler'?f(c.alquiler):'—';return`<tr${isBono?' style="color:#ccc"':''}><td>${lbl}</td><td>${base}</td>${results.map(x=>`<td>${x.r[key]!==undefined?f(x.r[key]):'—'}</td>`).join('')}</tr>`;}).join('');
  const totTds=results.map(x=>{const ah=+(c.factura-x.r.total).toFixed(2),isBest=best&&x.t.id===best.t.id;const badge=ah>0.005?`<span class="tsav spos" style="margin-left:5px;font-size:11px">−${f(ah)}</span>`:ah<-0.005?`<span class="tsav sneg" style="margin-left:5px;font-size:11px">+${f(Math.abs(ah))}</span>`:'';return`<td><strong style="color:${isBest?NAT_ORANGE:'inherit'}">${f(x.r.total)}</strong>${badge}</td>`;}).join('');
  const note=isPyme?`<p class="hint">* Bono Social mostrado como referencia; no incluido en el total según normativa Canarias.</p><p class="hint">Comparativa estimativa, no vinculante. Puede variar según lecturas reales del cliente.</p>`:`<p class="hint">Comparativa estimativa, no vinculante. Puede variar según lecturas reales del cliente.</p>`;
  return`<div class="pane">${authWarningBanner(seg)}
    <div class="export-bar">
      <button class="btn-export btn-pdf" onclick="exportPDF('${seg.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Exportar PDF</button>
      <button class="btn-export btn-xls" onclick="exportExcel('${seg.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Exportar Excel</button>
    </div>
    ${sc}
    <div style="overflow-x:auto"><table class="ct"><thead><tr><th>${ths}</th></tr></thead><tbody>${trs}<tr class="tr"><td><strong>TOTAL ESTIMADO</strong></td><td><strong>${f(c.factura)}</strong></td>${totTds}</tr></tbody></table></div>
    ${note}
    <div class="ch-wrap"><canvas id="compChart_${seg.id}"></canvas></div>
    <div id="legend_${seg.id}" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:#888"></div>
  </div>`;
}

function drawChart(seg){
  if(charts[seg.id]){charts[seg.id].destroy();delete charts[seg.id];}
  const canvas=document.getElementById('compChart_'+seg.id);
  if(!canvas||!seg.tarifas.length)return;
  const c=seg.cliente,results=seg.tarifas.filter(t=>t.selected).map((t,i)=>({t,r:calc(seg,t),color:COLS[i%COLS.length]}));
  if(!results.length)return;
  const best=results.reduce((a,b)=>b.r.total<a.r.total?b:a,results[0]);
  charts[seg.id]=new Chart(canvas,{type:'bar',data:{labels:['Factura actual',...results.map(x=>x.t.nombre)],datasets:[{data:[+c.factura,...results.map(x=>+x.r.total.toFixed(2))],backgroundColor:['#94a3b8',...results.map(x=>x.t.id===best.t.id?NAT_ORANGE:x.color)],borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw.toFixed(2).replace('.',',')+' €'}}},scales:{y:{ticks:{callback:v=>v.toFixed(0)+' €',font:{size:11}},grid:{color:'rgba(0,0,0,.05)'},border:{display:false}},x:{ticks:{font:{size:11},maxRotation:28},grid:{display:false},border:{display:false}}}}});
  const leg=document.getElementById('legend_'+seg.id);
  if(leg)leg.innerHTML=[`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#94a3b8;display:inline-block"></span>Factura actual</span>`,...results.map(x=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${x.t.id===best.t.id?NAT_ORANGE:x.color};display:inline-block"></span>${esc(x.t.nombre)}</span>`)].join('');
}

// ── EXPORT PDF ────────────────────────────────────────
function exportPDF(segId){
  const seg=segs[segId],c=seg.cliente;
  const{jsPDF}=window.jspdf;
  const isPyme=seg.taxModel!=='res';
  const results=seg.tarifas.filter(t=>t.selected).map(t=>({t,r:calc(seg,t)}));
  if(!results.length){alert('Selecciona al menos una tarifa para exportar.');return;}
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  results.forEach((item,idx)=>{if(idx>0)doc.addPage();pdfPage(doc,seg,c,item.t,item.r,isPyme);});
  doc.save(`Propuesta_Naturgy_${(c.nombre||'cliente').replace(/\s+/g,'_')}.pdf`);
}

function pdfPage(doc,seg,c,tar,r,isPyme){
  const L=10,R=200,CW=190;
  const navy=[0,40,85],or=[245,130,31],wh=[255,255,255];
  const gr=[245,245,245],bd=[190,190,190],altGr=[250,250,250];
  const lbs=['P1','P2','P3','P4','P5','P6'];
  const rh=6.5;
  function fill(col){doc.setFillColor(...col);}
  function stroke(col){doc.setDrawColor(...col);}
  function color(col){doc.setTextColor(...col);}
  function bold(s){doc.setFont('helvetica','bold');doc.setFontSize(s||7.5);}
  function norm(s){doc.setFont('helvetica','normal');doc.setFontSize(s||7);}
  function box(x,y,w,h,fc,sc){fill(fc||wh);stroke(sc||bd);doc.rect(x,y,w,h,'FD');}
  function vl(x,y,h){doc.line(x,y,x,y+h);}
  function tx(t,x,y,opts){doc.text(String(t===null||t===undefined?'':t),x,y,opts||{});}
  function fmt(v,d){return v!=null&&!isNaN(+v)?(+v).toFixed(d!=null?d:2).replace('.',','):'-';}
  function fmtE(v){return fmt(v)+' €';}
  let y=5;
  // ══ HEADER ══
  box(L,y,CW,rh);vl(L+56,y,rh);vl(L+138,y,rh);
  color(navy);bold(8);tx('PRESUPUESTO',L+2,y+4.5);
  color(or);bold(7.5);tx('CARGOS E IMPUESTOS  REDUCIDOS*',L+58,y+4.5);
  try{doc.addImage(LOGO_B64,'PNG',L+136,y+0.5,48,12);}catch(e){color(navy);bold(12);tx('Naturgy',L+148,y+4.8);}
  color(or);bold(10);tx('✔',L+186,y+4.5);
  y+=rh;
  box(L,y,CW,rh);vl(L+56,y,rh);
  color([140,140,140]);norm(6.5);tx('TARIFA POR USO',L+2,y+4.5);
  color(navy);bold(8);tx(c.cups||'—',L+58,y+4.5);
  y+=rh;
  box(L,y,CW,rh);
  color(navy);bold(8);tx((c.dir||'—').substring(0,72),L+2,y+4.5);
  y+=rh;
  box(L,y,CW,rh);vl(L+38,y,rh);vl(L+68,y,rh);
  color([140,140,140]);norm(6.5);tx('Lectura anterior',L+2,y+4.5);
  color([30,30,30]);norm(7.5);tx(c.f1||'—',L+40,y+4.5);
  color(navy);bold(9);tx(c.nombre||'—',L+70,y+4.5);
  y+=rh;
  box(L,y,CW,rh);vl(L+38,y,rh);vl(L+68,y,rh);vl(L+132,y,rh);
  color([140,140,140]);norm(6.5);tx('Lectura actual',L+2,y+4.5);
  color([30,30,30]);norm(7.5);tx(c.f2||'—',L+40,y+4.5);
  color([140,140,140]);norm(6.5);tx('FECHA OFERTA **',L+70,y+4.5);
  color(navy);bold(8);tx(new Date().toLocaleDateString('es-ES'),L+134,y+4.5);
  y+=rh+2;
  // ══ POTENCIA ══
  fill(or);stroke(or);doc.rect(L,y,CW,6,'F');
  color(wh);bold(8.5);tx('POTENCIA',L+2,y+4.2);
  y+=6;
  box(L,y,CW,6,gr);vl(L+45,y,6);vl(L+65,y,6);vl(L+110,y,6);
  color([80,80,80]);bold(6.5);tx(tar.potUnit==='dia'?'€/kW·día':'€/kW·año',L+2,y+4);tx('Días',L+47,y+4);
  y+=6;
  const potP=seg.potP||2;
  for(let i=0;i<potP;i++){
    const rate=tar.rPot[i]||0,kw=c.kw[i]||0;
    if(!rate&&!kw)continue;
    box(L,y,CW,rh,i%2?altGr:wh);vl(L+45,y,rh);vl(L+65,y,rh);vl(L+110,y,rh);
    color([30,30,30]);norm(7);tx(fmt(rate,6),L+2,y+4.5);tx(String(c.dias||0),L+47,y+4.5);
    bold(8);tx(lbs[i],L+67,y+4.5);
    y+=rh;
  }
  const dias=c.dias||1;
  const periods=potP===2?[['PUNTA',0],['VALLE',1]]:lbs.slice(0,potP).map((lb,i)=>[lb,i]);
  periods.forEach(([lbl,i])=>{
    const rate=tar.rPot[i]||0,kw=c.kw[i]||0;
    if(!rate||!kw)return;
    const cost=tar.potUnit==='dia'?rate*kw*dias:(rate/365)*kw*dias;
    const unitCost=tar.potUnit==='dia'?rate*kw:(rate/365)*kw;
    box(L,y,CW,rh,i%2?altGr:wh);
    vl(L+22,y,rh);vl(L+34,y,rh);vl(L+110,y,rh);vl(L+155,y,rh);
    color([30,30,30]);bold(7.5);tx(lbl,L+2,y+4.5);
    norm(7);tx(String(kw),L+24,y+4.5);
    tx(fmt(unitCost,9).replace(/,?0+$/,''),L+36,y+4.5);
    bold(7.5);tx('COSTE '+lbl,L+112,y+4.5);
    color(navy);tx(fmtE(cost),R-2,y+4.5,{align:'right'});
    y+=rh;
  });
  fill([255,244,230]);stroke(or);doc.rect(L,y,CW,7,'FD');vl(L+110,y,7);
  color(navy);bold(8.5);tx('COSTE POTENCIA',L+112,y+5);
  color(or);bold(11);tx(fmtE(r.potencia),R-2,y+5.5,{align:'right'});
  y+=7+2;
  // ══ CONSUMO ══
  fill(or);stroke(or);doc.rect(L,y,CW,6,'F');
  color(wh);bold(8.5);tx('CONSUMO',L+2,y+4.2);
  y+=6;
  box(L,y,CW,6,gr);vl(L+40,y,6);vl(L+58,y,6);vl(L+110,y,6);vl(L+155,y,6);
  color([80,80,80]);bold(6.5);tx('kWh',L+2,y+4);tx('€/kWh',L+60,y+4);
  y+=6;
  const nEn={uni:1,tri:3,hex:6}[tar.tipo]||1;
  // ── CORRECCIÓN v2: para tarifa 'uni', mostrar kWh TOTAL (suma P1+P2+P3)
  // igual que hace el Excel (muestra 337.63 en el ejemplo, no solo P1=95.14)
  for(let i=0;i<nEn;i++){
    const kwh=tar.tipo==='uni'
      ? c.en.reduce((a,v)=>a+(+v||0),0)   // SUMA TOTAL para tarifas unihorarias
      : (c.en[i]||0);                       // cada periodo para tri/hex
    const rate=tar.rEn[i]||0;
    if(!kwh&&i>0)continue;
    box(L,y,CW,rh,i%2?altGr:wh);
    vl(L+40,y,rh);vl(L+58,y,rh);vl(L+110,y,rh);vl(L+155,y,rh);
    color([30,30,30]);norm(7);
    tx(fmt(kwh,2),L+2,y+4.5);
    bold(8);tx(lbs[i],L+42,y+4.5);
    norm(7);tx(fmt(rate,6).replace(/,?0+$/,'')+' €',L+60,y+4.5);
    if(i===0){bold(7.5);color(navy);tx('COSTE ENERGÍA',L+112,y+4.5);tx(fmtE(r.energia),R-2,y+4.5,{align:'right'});}
    y+=rh;
  }
  const lineItems=isPyme?[
    ['SIN SVA',r.sva||0,false],['ALQUILER',r.alquiler,false],[null],
    ['SUBTOTAL',r.subtotal,true],['IMPUESTO ELEC.',r.impElec,false],
    ['BASE IMPONIBLE',r.alquiler,false],['IGIC Reducido',r.igicRed,false],
    ['IGIC 7% alquiler',r.igic7,false],['FINANCIACIÓN',null,false],['BONO SOCIAL',r.bonoSocial,false],
  ]:[
    ['SIN SVA',r.sva||0,false],['ALQUILER',r.alquiler,false],[null],
    ['SUBTOTAL',r.subtotal,true],['IMPUESTO ELEC.',r.impElec,false],
    ['BASE IMPONIBLE',r.alquiler,false],['IGIC',r.igic||0,false],
    ['FINANCIACIÓN',null,false],['BONO SOCIAL',r.bonoSocial,false],
  ];
  let ri=0;
  lineItems.forEach(([lbl,val,isBold])=>{
    if(lbl===null){y+=1.5;return;}
    box(L,y,CW,rh,ri%2?altGr:wh);vl(L+155,y,rh);
    if(isBold){color(navy);bold(7.5);}else{color([50,50,50]);norm(7);}
    tx(lbl,L+2,y+4.5);
    if(val!==null&&val!==undefined){color(navy);bold(7.5);tx(fmtE(val),R-2,y+4.5,{align:'right'});}
    ri++;y+=rh;
  });
  // Compensación excedentes
  box(L,y,CW,rh,ri%2?altGr:wh);vl(L+105,y,rh);vl(L+130,y,rh);vl(L+155,y,rh);
  color([50,50,50]);norm(6.5);tx('COMPENSACIÓN DE EXCEDENTES',L+2,y+4.5);
  tx('0',L+107,y+4.5);tx('0,07',L+132,y+4.5);
  color(navy);bold(7.5);tx('0 €',R-2,y+4.5,{align:'right'});
  y+=rh;
  // ══ TOTAL ══
  fill([255,244,230]);stroke(or);doc.rect(L,y,CW,9,'FD');vl(L+110,y,9);
  color(navy);bold(10);tx('TOTAL',L+2,y+6);
  color(or);bold(14);tx(fmtE(r.total),R-2,y+6.5,{align:'right'});
  y+=9+1;
  // ══ ATENDIDO POR / AHORRO ══
  const ahorro=+(c.factura-r.total).toFixed(2);
  const pct=c.factura>0?Math.abs(Math.round((ahorro/c.factura)*100)):0;
  const ahCol=ahorro>=0?[6,95,70]:[220,38,38];
  box(L,y,CW,9);vl(L+68,y,9);vl(L+132,y,9);
  color([120,120,120]);norm(6);tx('ATENDIDO POR:',L+2,y+3.5);
  color([20,20,20]);bold(7.5);tx(comercialData.nombre||'',L+2,y+7.5);
  if(comercialData.telefono){color([100,100,100]);norm(6);tx(comercialData.telefono,L+36,y+7.5);}
  color([120,120,120]);norm(6);tx('FACTURA CLIENTE',L+70,y+3.5);
  color(navy);bold(10);tx(fmtE(c.factura),L+130,y+8,{align:'right'});
  color([120,120,120]);norm(6);tx('AHORRO',L+134,y+3.5);
  color(ahCol);bold(10);tx((ahorro>=0?'- ':'+ ')+fmtE(Math.abs(ahorro)),R-2,y+8,{align:'right'});
  y+=9;
  fill([255,244,230]);stroke(or);doc.rect(L,y,CW,7,'FD');vl(L+68,y,7);
  color(or);bold(7.5);tx('**OFERTA TIEMPO LIMITADO',L+2,y+4.5);
  color([100,100,100]);norm(7);tx('AHORRO ESTIMADO',L+70,y+4.5);
  color(ahCol);bold(9);tx((ahorro>=0?'-':'+')+pct+'%',R-2,y+4.5,{align:'right'});
  y+=7+3;
  color([140,140,140]);norm(6);
  const disc='La presente comparativa es estimativa, sirve únicamente para dar una idea a nuestro cliente sobre cómo se le facturará con NATURGY S.A. este documento no es vinculante, puede variar según lecturas reales/estimadas del cliente. Nos basamos únicamente en la información de factura aportada por el cliente.';
  const dlines=doc.splitTextToSize(disc,CW);
  doc.text(dlines,L,y);
  y+=dlines.length*3.2+4;
  if(comercialData.email){color([100,100,100]);norm(6.5);tx(comercialData.email,L+70,y);y+=5;}
  box(L,y,CW,18);vl(L+95,y,18);
  color([100,100,100]);norm(7);tx('RECIBIDO',L+2,y+6);
  doc.line(L+5,y+13,L+93,y+13);
  color([50,50,50]);bold(8);tx(new Date().toLocaleDateString('es-ES'),L+20,y+16.5);
}

// ── EXPORT EXCEL ──────────────────────────────────────
function exportExcel(segId){
  const seg=segs[segId],c=seg.cliente,isPyme=seg.taxModel!=='res';
  const results=seg.tarifas.filter(t=>t.selected).map(t=>({t,r:calc(seg,t)}));
  const best=results.reduce((a,b)=>b.r.total<a.r.total?b:a,results[0]);
  const wb=XLSX.utils.book_new();
  const rowDefs=isPyme?[['Coste potencia','potencia'],['Coste energía','energia'],['SVA','sva'],['Alquiler','alquiler'],['Subtotal','subtotal'],['Imp. electricidad','impElec'],['IGIC Reducido 3%','igicRed'],['IGIC 7% alquiler','igic7'],['Bono Social (ref.)','bonoSocial']]:[['Coste potencia','potencia'],['Coste energía','energia'],['SVA','sva'],['Alquiler','alquiler'],['Subtotal','subtotal'],['Imp. electricidad','impElec'],['IGIC alquiler','igic'],['Bono Social','bonoSocial']];
  const header=['Componente','Factura actual',...results.map(x=>x.t.nombre)];
  const rows=[
    [`Comparativa Tarifas Naturgy — ${seg.label}`],[],
    ['Cliente:',c.nombre,'CUPS:',c.cups],['Dirección:',c.dir],
    ['Período:',`${c.f1} → ${c.f2}`,'Días:',c.dias],[],
    header,
    ...rowDefs.map(([lbl,key])=>[lbl,key==='alquiler'?+c.alquiler:null,...results.map(x=>x.r[key]!==undefined?+x.r[key]:null)]),
    ['TOTAL ESTIMADO',+c.factura,...results.map(x=>+x.r.total)],[],
    ['Mejor opción:',best.t.nombre,`Total: ${fRaw(best.r.total)} €`],
  ];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:28},{wch:16},...results.map(()=>({wch:20}))];
  XLSX.utils.book_append_sheet(wb,ws,'Comparativa');
  const wsC=XLSX.utils.aoa_to_sheet([
    ['Datos del cliente'],[],['Nombre',c.nombre],['CUPS',c.cups],['Dirección',c.dir],
    ['Lectura anterior',c.f1],['Lectura actual',c.f2],['Días',c.dias],
    [],['POTENCIA (kW)'],...c.kw.map((v,i)=>v?[`P${i+1}`,v]:[]).filter(x=>x.length),
    [],['CONSUMO (kWh)'],...c.en.map((v,i)=>v?[`P${i+1}`,v]:[]).filter(x=>x.length),
    [],['Factura actual (€)',c.factura],['Alquiler (€)',c.alquiler],
  ]);
  wsC['!cols']=[{wch:24},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsC,'Datos cliente');
  XLSX.writeFile(wb,`Comparativa_Naturgy_${seg.label.replace(/\s/g,'_')}.xlsx`);
}

// ── EVENT HANDLERS ────────────────────────────────────
function clearCliente(segId){
  if(!confirm('¿Limpiar todos los datos del cliente? Esta acción no se puede deshacer.'))return;
  const seg=segs[segId],c=seg.cliente;
  const keep={bonoRate:c.bonoRate,taxImpElec:c.taxImpElec,taxIGIC:c.taxIGIC,taxIGICRed:c.taxIGICRed,taxIGIC7:c.taxIGIC7,alquiler:c.alquiler};
  segs[segId].cliente={nombre:'',cups:'',dir:'',f1:'',f2:'',dias:0,kw:[0,0,0,0,0,0],en:[0,0,0,0,0,0],factura:0,...keep};
  renderContent();
}
function upCf(segId,field,val){segs[segId].cliente[field]=val===''?'':isNaN(+val)?val:+val;if(activeSubTab[segId]==='comp')renderContent();else refreshPreviews(segId);}
function upC(segId,field,idx,val){segs[segId].cliente[field][idx]=+val;if(activeSubTab[segId]==='comp')renderContent();else refreshPreviews(segId);}
function upDate(segId,field,val){segs[segId].cliente[field]=val;const c=segs[segId].cliente;if(c.f1&&c.f2){const d=Math.round((new Date(c.f2)-new Date(c.f1))/(864e5));if(d>0){c.dias=d;const el=document.getElementById('dias_'+segId);if(el)el.value=d;}}if(activeSubTab[segId]==='comp')renderContent();else refreshPreviews(segId);}
function upTf(segId,tid,field,val){if(!adminMode)return;const t=segs[segId].tarifas.find(x=>x.id===tid);if(t){t[field]=isNaN(+val)?val:+val;refreshTPreview(segId,tid);}}
function upTarr(segId,tid,field,idx,val){if(!adminMode)return;const t=segs[segId].tarifas.find(x=>x.id===tid);if(t){t[field][idx]=+val;refreshTPreview(segId,tid);}}
function refreshTPreview(segId,tid){
  const seg=segs[segId],t=seg.tarifas.find(x=>x.id===tid);if(!t)return;
  const r=calc(seg,t),ah=+(seg.cliente.factura-r.total).toFixed(2);
  const ep=document.getElementById('prev_'+tid),es=document.getElementById('sav_'+tid),ers=document.getElementById('rsub_'+tid);
  if(ep)ep.textContent=f(r.total);
  if(es){es.className='tsav '+(ah>0.005?'spos':ah<-0.005?'sneg':'sneu');es.textContent=ah>0.005?`−${f(ah)}`:ah<-0.005?`+${f(Math.abs(ah))}`:'Igual';}
  if(ers){ers.innerHTML=buildRsub(r,seg.taxModel!=='res');}
  if(activeSubTab[segId]==='comp')renderContent();
}
function refreshPreviews(segId){segs[segId].tarifas.forEach(t=>refreshTPreview(segId,t.id));}
function togT(segId,tid){const t=segs[segId].tarifas.find(x=>x.id===tid);if(!t)return;t.open=!t.open;const bd=document.getElementById('body_'+tid);if(bd){bd.className='tb'+(t.open?' on':'');if(t.open)bd.innerHTML=buildTBody(segs[segId],t,0);const chev=bd.closest('.tc')?.querySelector('.chev');if(chev)chev.className='chev'+(t.open?' r':'');}}
function renT(segId,tid,val){if(!adminMode)return;const t=segs[segId].tarifas.find(x=>x.id===tid);if(t){t.nombre=val;if(activeSubTab[segId]==='comp')renderContent();}}
function chgTipo(segId,tid,tipo){if(!adminMode)return;const t=segs[segId].tarifas.find(x=>x.id===tid);if(!t)return;t.tipo=tipo;const bd=document.getElementById('body_'+tid);if(bd)bd.innerHTML=buildTBody(segs[segId],t,0);refreshTPreview(segId,tid);}
function delT(segId,tid){if(!adminMode)return;segs[segId].tarifas=segs[segId].tarifas.filter(x=>x.id!==tid);renderContent();}
function togSelect(segId,tid){const t=segs[segId].tarifas.find(x=>x.id===tid);if(t){t.selected=!t.selected;refreshPreviews(segId);}}
function addTariff(segId){if(!adminMode)return;const seg=segs[segId],newId='u'+(++_tariffId);seg.tarifas.push({id:newId,nombre:'Nueva tarifa',tipo:seg.potP===6?'hex':'uni',potUnit:'dia',rPot:[0,0,0,0,0,0],rEn:[0,0,0,0,0,0],sva:0,open:true,selected:true});renderContent();}

updateAdminBtn();renderSegBar();renderSubBar();renderContent();
</script>
